version: '3.8'

services:
  clearsky-inference:
    build:
      context: .
      dockerfile: Dockerfile.jetson
    container_name: clearsky-inference
    runtime: nvidia
    privileged: true
    devices:
      - /dev/video0:/dev/video0
      - /dev/video1:/dev/video1
    environment:
      - CONF_THRESHOLD=0.55
      - IMGSZ=640
      - CAMERA_INDEX=0
      - WIDTH=1280
      - HEIGHT=720
      - FPS=30
    volumes:
      - ./weights:/app/weights:ro
    restart: unless-stopped
    stdin_open: true
    tty: true